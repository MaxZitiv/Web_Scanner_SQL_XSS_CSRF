[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "web-scanner-sql-xss-csrf"
version = "1.0.0"
description = "Веб-сканер для поиска SQL Injection, XSS и CSRF уязвимостей"
authors = [{ name = "Web Scanner Team" }]
requires-python = ">=3.14"
dependencies = [
    "PyQt6>=6.9.0,<7.0.0",
    "PyQt6-Charts>=6.9.0",
    "qasync>=0.26.0",
    "numpy>=2.1.0",
    "aiohttp>=3.10.0,<4.0.0",
    "requests>=2.32.0,<3.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "bcrypt>=4.1.0,<5.0.0",
    "cryptography>=41.0.0",
    "pyotp>=2.9.0,<3.0.0",
    "reportlab>=4.0.0,<5.0.0",
    "fpdf>=1.7.2,<2.0.0",
    "matplotlib>=3.10.0,<4.0.0",
    "psutil>=6.0.0,<7.0.0",
    "pytz>=2024.1",
    "PyInstaller>=6.15.0",
    "typing-extensions>=4.9.0",
    "python-dotenv>=1.0.0",
    "cachetools>=5.3.0",
    "bandit>=1.7.5",
    "attrs>=23.2.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "flake8>=7.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 120
target-version = "py314"
exclude = [
    ".git",
    ".venv",
    "build",
    "dist",
    "data",
    "logs",
    "plugins",
    "typings",
    ".pylance_stubs",
    "node_modules",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "PERF",
    "FURB",
    "PIE",
    "RUF",
]
ignore = [
    # Русскоязычные строки проекта содержат кириллические символы, которые
    # внешне похожи на латинские. Это не ошибка проекта, поэтому отключаем
    # «ambiguous unicode character» предупреждения.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"cli/*.py" = ["PLR2004"]
# Файлы ниже перед импортом внутренних модулей выполняют bootstrap пути
# (add_to_path / загрузка sys_utils). Это намеренный порядок для работы как из
# исходной директории, так и из PyInstaller-сборки.
"cli/cli_mode.py" = ["E402"]
"main.py" = ["E402"]
"ui/main_window.py" = ["E402"]
"utils/migrate_avatar.py" = ["E402"]
"views/login_window.py" = ["E402"]


[tool.setuptools.packages.find]
include = [
    "cli*",
    "controllers*",
    "export*",
    "models*",
    "policies*",
    "scanner*",
    "ui*",
    "utils*",
    "views*",
]
exclude = ["data*", "logs*", "typings*", "plugins*", "build*", "dist*"]

[tool.pyright]
venvPath = "."
venv = ".venv"
stubPath = ".pylance_stubs"
typeCheckingMode = "strict"
pythonVersion = "3.14"
include = ["."]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.git",
    "**/.venv/**",
    "**/build/**",
    "**/dist/**",
    "**/data/**",
    "**/logs/**",
    "**/plugins/**",
    "**/typings/**",
    "**/.pylance_stubs/**",
]
