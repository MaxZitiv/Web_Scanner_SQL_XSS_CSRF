name: Pyright

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Check lint
        run: .venv/bin/python -m ruff check .
      - name: Check types
        run: .venv/bin/python -m pyright
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - name: Test application
        id: tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -o pipefail
          mkdir -p .cache
          .venv/bin/python -c "from PyQt6.QtWidgets import QApplication; from PyQt6.QtCharts import QChart"
          .venv/bin/python -m pytest -q --junitxml=.cache/test-results.xml 2>&1 | tee .cache/pytest.log
          git diff --exit-code -- data/scanner.db scanner.db
      - name: Summarize tests
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          .venv/bin/python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          def annotate(level, message):
              escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::{level} title=pytest::{escaped}')

          results = Path('.cache/test-results.xml')
          log = Path('.cache/pytest.log')
          if results.exists():
              root = ET.parse(results).getroot()
              totals = {key: sum(int(suite.get(key, 0)) for suite in root.iter('testsuite'))
                        for key in ('tests', 'failures', 'errors', 'skipped')}
              annotate('notice', ', '.join(f'{key}: {value}' for key, value in totals.items()))
              for case in root.iter('testcase'):
                  for issue in (*case.findall('failure'), *case.findall('error')):
                      annotate('error', f"{case.get('name')}: {issue.text or issue.get('message', '')}")
          elif log.exists():
              annotate('error', log.read_text()[-12000:])
          PY
