name: Pyright

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"
      - name: Check types
        run: .venv/bin/python -m pyright
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libopengl0 libxkbcommon0 libdbus-1-3
      - name: Test history cleanup
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .venv/bin/python -c "from PyQt6.QtWidgets import QApplication; from PyQt6.QtCharts import QChart"
          .venv/bin/python -m pytest -q
